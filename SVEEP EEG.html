<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SSVEP EEG Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        background: #05070a;
        color: #eee;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    header {
        padding: 10px 0;
        background: #0b1018;
        box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    h1 {
        margin: 5px 0;
        font-size: 24px;
    }

    #top-bar {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 5px;
    }

    button {
        padding: 8px 16px;
        margin: 4px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background: #444;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #666;
    }

    #status, #eeg-info {
        margin-top: 6px;
        font-size: 14px;
    }

    #main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
    }

    #container {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 16px;
        width: 100%;
        max-width: 600px;
        margin-top: 10px;
    }

    @media (max-width: 480px) {
        #container {
            grid-template-columns: 1fr;
        }
    }

    .box {
        border: 2px solid #555;
        padding: 12px;
        border-radius: 10px;
        background: #151922;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
        position: relative;
        overflow: hidden;
    }

    .box.active {
        background: #00aaff;
        border-color: #00ffff;
        transform: scale(1.03);
        box-shadow: 0 0 15px rgba(0,255,255,0.7);
    }

    .box .pulse {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(0,255,255,0.25) 0%, transparent 60%);
        opacity: 0;
        pointer-events: none;
        animation: pulse 1s infinite;
    }

    .box.active .pulse {
        opacity: 1;
    }

    @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.4; }
        50% { transform: scale(1.1); opacity: 0.8; }
        100% { transform: scale(1.3); opacity: 0.0; }
    }

    .label {
        font-size: 20px;
        margin-bottom: 6px;
    }

    .freq {
        font-size: 14px;
        margin-top: 6px;
        color: #bbb;
    }

    .eeg-freq {
        font-size: 13px;
        margin-top: 4px;
        color: #8fdcff;
    }

    #graph-container {
        margin-top: 20px;
        width: 100%;
        max-width: 700px;
        background: #10141d;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    #graph-title {
        font-size: 16px;
        margin-bottom: 6px;
    }

    #eeg-canvas {
        width: 100%;
        height: 180px;
        background: #05070a;
        border-radius: 6px;
    }
</style>
</head>
<body>

<header>
    <h1>SSVEP EEG Control Panel</h1>
    <div id="top-bar">
        <button onclick="connectUSB()">Connect USB</button>
        <button onclick="connectBT()">Connect Bluetooth</button>
        <button onclick="toggleMCP2()">Toggle MCP2</button>
        <button onclick="resetFocus()">Idle</button>
    </div>
    <div id="status">EEG Status: Not Connected</div>
    <div id="eeg-info">Signal: -- | Mode: SSVEP | Battery: --%</div>
</header>

<div id="main">
    <div id="container">
        <div class="box" id="box1" onclick="focusBox(1)">
            <div class="pulse"></div>
            <div class="label">Forward</div>
            <div class="freq">10 Hz target</div>
            <div class="eeg-freq" id="box1-eeg">EEG: -- Hz</div>
        </div>

        <div class="box" id="box2" onclick="focusBox(2)">
            <div class="pulse"></div>
            <div class="label">Backward</div>
            <div class="freq">12 Hz target</div>
            <div class="eeg-freq" id="box2-eeg">EEG: -- Hz</div>
        </div>

        <div class="box" id="box3" onclick="focusBox(3)">
            <div class="pulse"></div>
            <div class="label">Left</div>
            <div class="freq">15 Hz target</div>
            <div class="eeg-freq" id="box3-eeg">EEG: -- Hz</div>
        </div>

        <div class="box" id="box4" onclick="focusBox(4)">
            <div class="pulse"></div>
            <div class="label">Right</div>
            <div class="freq">20 Hz target</div>
            <div class="eeg-freq" id="box4-eeg">EEG: -- Hz</div>
        </div>
    </div>

    <div id="graph-container">
        <div id="graph-title">Live EEG Power (SSVEP band)</div>
        <canvas id="eeg-canvas"></canvas>
    </div>
</div>

<script>
let mcp2_enabled = false; // disabled by default
let ws = null;
let eegData = [];
const MAX_POINTS = 300;

// --- Connection buttons ---
function connectUSB() {
    document.getElementById("status").innerText = "EEG Status: Connected via USB";
    openWebSocket("ws://" + window.location.hostname + ":8765/eeg");
}

function connectBT() {
    document.getElementById("status").innerText = "EEG Status: Connected via Bluetooth";
    openWebSocket("ws://" + window.location.hostname + ":8765/eeg");
}

function toggleMCP2() {
    mcp2_enabled = !mcp2_enabled;
    alert("MCP2 " + (mcp2_enabled ? "ENABLED" : "DISABLED"));
}

function resetFocus() {
    document.querySelectorAll(".box").forEach(b => b.classList.remove("active"));
    sendVoltage(2.5, 2.5);
}

// --- DAC control ---
function sendVoltage(mcp1, mcp2) {
    fetch("/set_voltage", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            mcp1: mcp1,
            mcp2: mcp2_enabled ? mcp2 : 0
        })
    }).catch(() => {});
}

// --- Box focus logic ---
function focusBox(id) {
    document.querySelectorAll(".box").forEach(b => b.classList.remove("active"));
    document.getElementById("box" + id).classList.add("active");

    if (id === 1) sendVoltage(3.3, 0);      // Forward → MCP1 = 3.3V
    if (id === 2) sendVoltage(0.4, 0);      // Backward → MCP1 = 0.4V
    if (id === 3) sendVoltage(0, 3.3);      // Left → MCP2 = 3.3V
    if (id === 4) sendVoltage(0, 0.4);      // Right → MCP2 = 0.4V
}

// Idle voltage when nothing active
setInterval(() => {
    let active = document.querySelector(".box.active");
    if (!active) sendVoltage(2.5, 2.5);
}, 800);

// --- WebSocket for real EEG ---
function openWebSocket(url) {
    try {
        ws = new WebSocket(url);
    } catch (e) {
        console.log("WebSocket error:", e);
        return;
    }

    ws.onopen = () => {
        console.log("WebSocket connected");
        document.getElementById("status").innerText = "EEG Status: Streaming";
    };

    ws.onmessage = (event) => {
        // Expect JSON like:
        // { box_freqs: {1: 9.8, 2: 12.1, 3: 15.0, 4: 19.7}, power: 0.42, battery: 87, signal: "Good" }
        let data;
        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        if (data.box_freqs) {
            for (let i = 1; i <= 4; i++) {
                const val = data.box_freqs[i];
                const el = document.getElementById("box" + i + "-eeg");
                if (el && val !== undefined) {
                    el.innerText = "EEG: " + val.toFixed(2) + " Hz";
                }
            }
        }

        if (data.power !== undefined) {
            eegData.push(data.power);
            if (eegData.length > MAX_POINTS) eegData.shift();
            drawEEG();
        }

        if (data.battery !== undefined && data.signal) {
            document.getElementById("eeg-info").innerText =
                "Signal: " + data.signal + " | Mode: SSVEP | Battery: " + data.battery + "%";
        }
    };

    ws.onclose = () => {
        console.log("WebSocket closed");
        document.getElementById("status").innerText = "EEG Status: Disconnected";
    };
}

// --- Simple live graph ---
function drawEEG() {
    const canvas = document.getElementById("eeg-canvas");
    const ctx = canvas.getContext("2d");

    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = canvas.clientHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 2;
    ctx.beginPath();

    if (eegData.length === 0) return;

    for (let i = 0; i < eegData.length; i++) {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = h - (eegData[i] * h); // assume power in [0,1]
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
}
</script>

</body>
</html>
